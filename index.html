  <script src="theme.js"></script>
  <script>
    /* the pen and the cursor drift gently with the mouse, at different depths */
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      var layers = [
        { el: document.querySelector(".float--pen"),    depth: -34 },  /* design px; negative = moves against the mouse */
        { el: document.querySelector(".float--cursor"), depth:  48 }
      ];
      var target = { x: 0, y: 0 }, pos = { x: 0, y: 0 };
      addEventListener("pointermove", function (e) {
        target.x = (e.clientX / innerWidth  - 0.5) * 2;   /* -1 … 1 */
        target.y = (e.clientY / innerHeight - 0.5) * 2;
      });
      document.addEventListener("pointerleave", function () { target.x = 0; target.y = 0; });
      (function tick() {
        pos.x += (target.x - pos.x) * 0.07;               /* easing */
        pos.y += (target.y - pos.y) * 0.07;
        var u = innerWidth / 1920;
        layers.forEach(function (l) {
          l.el.style.translate = (pos.x * l.depth * u) + "px " + (pos.y * l.depth * u) + "px";
        });
        requestAnimationFrame(tick);
      })();
    })();

    /* DESIGN is slower than the page on scroll, and its gradient fades out as you leave the hero */
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var el = document.querySelector(".hero__design"), ticking = false;
      function update() {
        ticking = false;
        var y = Math.max(0, scrollY), p = Math.min(1, y / (innerWidth / 1920 * 700));
        el.style.translate = "0 " + (y * 0.35) + "px";
        el.style.setProperty("--fade", p.toFixed(3));
      }
      addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
      update();
    })();

    /* project cards rise in as they enter the screen */
    (function () {
      var cards = document.querySelectorAll(".card");
      if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) {
        cards.forEach(function (c) { c.classList.add("is-in"); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
      cards.forEach(function (c) { io.observe(c); });
    })();
  </script>
